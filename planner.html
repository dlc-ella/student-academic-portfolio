    <main>
        <section id="planner">
            <h1 class="page-title">Academic Task Planner</h1>
            <p class="lead">
                A simple study tool for adding and organising academic tasks.
            </p>

            <div class="planner-panel">
                <form id="taskForm">
                    <label for="taskName">Enter New Academic Task:</label>
                    <div class="task-row">
                        <input type="text" id="taskName" placeholder="e.g. Complete COS 106 Lab Report">
                        <button type="submit">Add Task</button>
                    </div>
                </form>
            </div>

            <ul id="taskList"></ul>
            <p id="emptyMessage" class="lead">No tasks yet.</p>
        </section>
    </main>
